kind: component
id: toggle
name: Toggle
description: An on/off switch for a setting that takes effect as soon as it changes.

metadata:
  updated: {date: 2026-11-15}
  tags: [form]
  status: {status: stable}

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: should
        statement: Use Toggle for settings that apply immediately, such as turning on automatic watering.
        checkedBy: manual
      - level: should-not
        statement: Do not use Toggle for a choice that is saved when a form is submitted; use <dsds:checkbox>.
        alternatives:
          - to: checkbox
        checkedBy: manual
  - kind: guidelines
    for: all
    items:
      - level: must
        statement: Always pass ariaLabel with the name of the setting. Toggle has no visible label of its own.
        checkedBy: manual
        tags: [accessibility]
      - level: should
        statement: Show the setting's name as text beside the toggle, using the same words as ariaLabel.
        checkedBy: manual
      - level: should-not
        statement: Do not use showLabel by default. Add it only when the setting's name doesn't make on and off obvious.
        checkedBy: manual
  - kind: guidelines
    for: agent
    title: Common misreadings
    items:
      - level: must
        statement: Pass ariaLabel in camelCase. Toggle does not accept aria-label or label.
        checkedBy: manual
      - level: must
        statement: Expect onChange to receive true or false, not an event.
        checkedBy: manual
      - level: must
        statement: Read the value from your own state. Toggle has no name prop and isn't included when a form is submitted.
        checkedBy: manual
      - level: must-not
        statement: Do not pass both checked and defaultChecked. Use checked with onChange when the parent owns the value, or defaultChecked alone when the toggle manages itself.
        checkedBy: manual

alternatives:
  - to: checkbox

refs:
  - href: https://greenhouse-design-system.vercel.app/components/toggle
    rel: demo
    role: docsite

sourceFiles:
  - platform: react
    file: components/Toggle/Toggle.tsx

imports:
  - platform: react
    code: 'import { Toggle } from "@adeeeeta/greenhouse";'
    package: "@adeeeeta/greenhouse"

traits:
  - traitType: state
    kind: boolean
    id: checked
    description: On. Use checked with onChange, or defaultChecked to set only the starting state.
  - traitType: state
    kind: boolean
    id: disabled
    description: Shown at reduced opacity and can't be changed.
  - traitType: variant
    kind: boolean
    id: showLabel
    description: Shows On or Off text beside the track.