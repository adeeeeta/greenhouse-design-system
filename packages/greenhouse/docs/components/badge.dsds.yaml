kind: component
id: badge
name: Badge
description: A small read-only label that shows the status of something, such as a plant's health.

metadata:
  updated: {date: 2026-11-16}
  tags: [data-display]
  status: {status: stable}

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: should
        statement: Use Badge to show a status at a glance, such as Healthy, Needs water or Dormant.
        checkedBy: manual
      - level: should-not
        statement: Do not use Badge for a label the user can remove or filter by; use <dsds:tag>.
        alternatives:
          - to: tag
        checkedBy: manual
      - level: should-not
        statement: Do not use Badge for a message that needs explaining; use <dsds:alert>.
        alternatives:
          - to: alert
        checkedBy: manual
  - kind: guidelines
    for: all
    items:
      - level: must
        statement: Say the status in words in label. Color alone must not carry the meaning.
        checkedBy: manual
        tags: [accessibility]
      - level: should
        statement: Match variant to meaning. Use success for good, warning for needs attention, error for a problem, info for neutral facts and neutral for everything else.
        checkedBy: manual
      - level: should
        statement: Keep label to one or two words.
        checkedBy: manual
      - level: should
        statement: Use sm in compact places such as table cells, and md (the default) elsewhere.
        checkedBy: manual
  - kind: guidelines
    for: agent
    title: Common misreadings
    items:
      - level: must
        statement: Pass the text as the label prop, not as children. Badge ignores children.
        checkedBy: manual
      - level: must-not
        statement: Do not add onClick or onDismiss. Badge is not interactive.
        checkedBy: manual

alternatives:
  - to: tag

refs:
  - href: https://greenhouse-design-system.vercel.app/components/badge
    rel: demo
    role: docsite

sourceFiles:
  - platform: react
    file: components/Badge/Badge.tsx

imports:
  - platform: react
    code: 'import { Badge } from "@adeeeeta/greenhouse";'
    package: "@adeeeeta/greenhouse"

traits:
  - traitType: variant
    kind: enum
    id: variant
    description: Color, matched to the meaning of the status.
    values:
      - id: neutral
        description: The default. No particular meaning.
      - id: success
        description: Good, such as Healthy.
      - id: warning
        description: Needs attention soon, such as Needs water.
      - id: error
        description: A problem, such as Pest detected.
      - id: info
        description: A neutral fact, such as Dormant.
  - traitType: variant
    kind: enum
    id: size
    description: Overall scale.
    values:
      - id: sm
        description: Compact places such as table cells.
      - id: md
        description: The default.