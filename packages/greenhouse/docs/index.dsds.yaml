schemaVersion: "0.23.1"
$schema: https://designsystemdocspec.org/v0.23.1/dsds.bundled.yaml
 
name: Greenhouse
 
entries:
  - kind: system
    id: greenhouse
    name: Greenhouse
    description: A React component library and token system for calm, plant-themed interfaces.
    metadata:
      status: {status: stable}
      url: https://greenhouse-design-system.vercel.app
      version: 1.2.0
      platforms: [react]
      license: MIT
      sourceRoot: ../src/
    sections:
      - kind: steps
        for: all
        title: Setup
        items:
          - title: Import tokens.css and styles.css once at the app root.
          - title: Load Plus Jakarta Sans, Fraunces and Fira Code and set --font-sans-face, --font-display-face and --font-mono-face.
          - optional: true
            title: Wrap the app in ToastProvider inside a client component.
      - kind: guidelines
        for: all
        title: Spacing
        items:
          - level: must-not
            statement: Do not add padding to content placed directly inside Card, Alert or Modal; they pad themselves.
            checkedBy: manual
          - level: should
            statement: Space children inside a component with gap on a flex or grid wrapper, not margins.
            checkedBy: manual
 
refs:
  - href: ./components/button.dsds.yaml
    rel: file
    role: Button component
  - href: ./components/card.dsds.yaml
    rel: file
    role: Card component
  - href: ./components/link.dsds.yaml
    rel: file
    role: Link component
  - href: ./components/alert.dsds.yaml
    rel: file
    role: Alert component
  - href: ./components/toast.dsds.yaml
    rel: file
    role: Toast component
  - href: ./components/modal.dsds.yaml
    rel: file
    role: Modal component
  - href: ./components/text-input.dsds.yaml
    rel: file
    role: TextInput component
  - href: ./components/dropdown.dsds.yaml
    rel: file
    role: Dropdown component
  - href: ./components/checkbox.dsds.yaml
    rel: file
