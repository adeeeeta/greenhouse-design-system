schemaVersion: "0.23.1"
$schema: https://designsystemdocspec.org/v0.23.1/dsds.bundled.yaml
 
name: Greenhouse
 
entries:
  - kind: system
    id: greenhouse
    name: Greenhouse
    description: A React component library and token system for calm, plant-themed interfaces.
    metadata:
      status: {status: stable}
      url: https://greenhouse-design-system.vercel.app
      version: 1.2.0
      platforms: [react]
      license: MIT
      sourceRoot: ../src/
    sections:
      - kind: steps
        for: all
        title: Setup
        items:
          - title: Import tokens.css and styles.css once at the app root.
          - title: Load Plus Jakarta Sans, Fraunces and Fira Code and set --font-sans-face, --font-display-face and --font-mono-face.
          - optional: true
            title: Wrap the app in ToastProvider inside a client component.
      - kind: guidelines
        for: all
        title: Spacing
        items:
          - level: must-not
            statement: Do not add padding to content placed directly inside Card, Alert or Modal; they pad themselves.
            checkedBy: manual
          - level: should
            statement: Space children inside a component with gap on a flex or grid wrapper, not margins.
            checkedBy: manual
 
      - kind: guidelines
        for: agent
        title: Known gaps
        items:
          - level: must-not
            statement: Do not use scale tokens such as --green-600 or --amber-600 for success, warning or info colors. No semantic tokens exist for them yet; use the Badge, Alert or Tag variants instead.
            checkedBy: manual
          - level: must-not
            statement: Do not invent elevation tokens. --shadow-1 is the only shadow in code, although the Figma file defines more levels.
            checkedBy: manual
          - level: must-not
            statement: Do not use legacy tokens (--text-1 to --text-4, --control-font-size) or component tokens (--button-*, --badge-* and similar) in your own CSS.
            checkedBy: manual

