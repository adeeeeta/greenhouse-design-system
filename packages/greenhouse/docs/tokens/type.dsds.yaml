- kind: token
  id: font-sans
  name: Sans
  description: The main typeface, Plus Jakarta Sans, with system fallbacks. Used for body text, UI and headings h1 to h4.
  metadata:
    updated:
      date: '2026-11-16'
    tags:
    - font
    status:
      status: stable
    group: font.family
    aliases:
    - --font-sans
  sections:
  - kind: guidelines
    for: all
    items:
    - level: should
      statement: Use for all text except code and expressive display headings.
      checkedBy: manual
  tokenType: fontFamily
  source: ../../src/styles/tokens.css
- kind: token
  id: font-display
  name: Display
  description: The expressive serif, Fraunces, with serif fallbacks.
  metadata:
    updated:
      date: '2026-11-16'
    tags:
    - font
    status:
      status: stable
    group: font.family
    aliases:
    - --font-display
  sections:
  - kind: guidelines
    for: all
    items:
    - level: should
      statement: Use only for expressive display headings such as page heroes.
      checkedBy: manual
    - level: must-not
      statement: Do not use on utility screens such as settings, forms or tables.
      checkedBy: manual
  tokenType: fontFamily
  source: ../../src/styles/tokens.css
