schemaVersion: "0.23.1"
name: Greenhouse typography tokens
entries:
- kind: token
  id: type-display-size
  name: Display size
  description: Font size for the display step. The largest heading, set in Fraunces for expressive moments.
  metadata:
    updated:
      date: '2026-11-16'
    tags:
    - type
    status:
      status: stable
    group: type
    aliases:
    - --type-display-size
  sections:
  - kind: guidelines
    for: all
    items:
    - level: should
      statement: Prefer the Text component. Use this token only in your own CSS.
      checkedBy: manual
  tokenType: dimension
  source: ../../src/styles/tokens.css
  combos:
  - subject: '{type-display-size}'
    level: must
    items:
    - '{type-display-line}'
    note: Each size is tuned to its own line height. Mixing steps breaks the vertical rhythm.
- kind: token
  id: type-display-line
