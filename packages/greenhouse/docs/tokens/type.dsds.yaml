- kind: token
  id: font-sans-face
  name: Plus Jakarta Sans face
  description: An input you set when loading Plus Jakarta Sans. Greenhouse does not load fonts itself.
  metadata:
    updated:
      date: '2026-11-16'
    tags:
    - font
    status:
      status: stable
    group: font.face
    aliases:
    - --font-sans-face
  sections:
  - kind: guidelines
    for: all
    items:
    - level: must
      statement: Set this variable when you load the font, for example through next/font with variable set to this name.
      checkedBy: manual
  - kind: guidelines
    for: agent
    title: Common misreadings
    items:
    - level: must-not
      statement: Do not use this token in component CSS. Use the matching font-sans, font-display or font-mono token, which include fallbacks.
      checkedBy: manual
  tokenType: fontFamily
  source: ../../src/styles/tokens.css
