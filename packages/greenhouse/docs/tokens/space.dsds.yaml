entries:
- kind: token
  id: space-1
  name: Space 1
  description: 4px on the 4px spacing scale.
  metadata:
    updated:
      date: '2026-11-16'
    tags:
    - space
    status:
      status: stable
    group: space
    aliases:
    - --space-1
  sections:
  - kind: guidelines
    for: all
    items:
    - level: should
      statement: Use for hairline gaps, such as between a label and its required mark.
      checkedBy: manual
  - kind: guidelines
    for: agent
    title: Common misreadings
    items:
    - level: must-not
      statement: Do not use --space-7, --space-9 or --space-11. They don't exist; the scale skips from 6 to 8, 8 to 10 and 10 to 12.
      checkedBy: manual
    - level: must-not
      statement: Do not use raw pixel values for spacing. If a value isn't on the scale, use the nearest step.
      checkedBy: manual
  tokenType: dimension
  source: ../../src/styles/tokens.css
